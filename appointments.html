<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartClinic+ | Appointments</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app-container">

    <aside class="sidebar">

        <div class="sidebar-logo">
            🏥 SmartClinic+
        </div>

        <a href="dashboard.html">📊 Dashboard</a>

        <a href="appointments.html" class="active">
            📅 Appointments
        </a>

        <a href="doctors.html">
            👨‍⚕️ Doctors
        </a>

        <a href="prescriptions.html">
            💊 Prescriptions
        </a>

        <a href="lab-results.html">
            🧪 Lab Results
        </a>

        <a href="profile.html">
            👤 My Profile
        </a>

        <a href="index.html">
            🚪 Logout
        </a>

    </aside>


    <main class="main-content">

        <div class="topbar">

            <div>

                <h1>Appointments</h1>

                <p class="user-info">
                    Book and manage your healthcare appointments.
                </p>

            </div>

        </div>


        <div class="content-card">

            <h2>Book a New Appointment</h2>

            <br>

            <label>Choose Department</label>

            <select>
                <option>General Medicine</option>
                <option>Cardiology</option>
                <option>Dermatology</option>
                <option>Pediatrics</option>
            </select>

            <br><br>

            <label>Choose Doctor</label>

            <select>
                <option>Dr. Sarah Lee</option>
                <option>Dr. Michael Tan</option>
                <option>Dr. Emily Wong</option>
            </select>

            <br><br>

            <label>Appointment Date</label>

            <input type="date">

            <label>Appointment Time</label>

            <input type="time">

            <button class="primary-btn">
                Book Appointment
            </button>

        </div>


        <div class="content-card">

            <h2>My Appointments</h2>

            <table>

                <tr>
                    <th>Doctor</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Status</th>
                </tr>

                <tr>
                    <td>Dr. Sarah Lee</td>
                    <td>25 Sep 2026</td>
                    <td>10:30 AM</td>
                    <td>
                        <span class="status">
                            Confirmed
                        </span>
                    </td>
                </tr>

            </table>

        </div>

    </main>

</div>

</body>

</html>
